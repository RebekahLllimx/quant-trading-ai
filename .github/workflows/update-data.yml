name: Update Market Data

on:
  schedule:
    # Each trading day UTC 10:00 = Beijing time 18:00 (AAfter the closing of shares)
    # Monday to Friday
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    # Manually Trigger Entry: GitHub warehouse  ->  Actions  ->  Update Market Data  ->  Run workflow
    inputs:
      prefer_tushare:
        description: 'Prefer Tushare for this manual run (falls back automatically)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# prevent the same workflow Concurrent execution (Manually triggering on the same day will not conflict with scheduled tasks)
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install tushare akshare pandas numpy requests openpyxl

      - name: Fetch latest market data
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PREFER_TUSHARE: ${{ inputs.prefer_tushare || false }}
        run: |
          if [ "$PREFER_TUSHARE" = "true" ]; then
            python update_all_data.py --prefer-tushare
          else
            python update_all_data.py
          fi

      - name: Update TASK7 shadow portfolios
        run: |
          python Task7/scripts/update_live_data.py --use-existing-on-error
          python Task7/scripts/shadow_engine.py
          python Task7/scripts/build_dashboard.py
          python Task7/scripts/validate_results.py

      - name: Check for changes
        id: git-check
        run: |
          git status --short
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected  -  skipping commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/csv/*.csv Task3/dashboard/index.html Task4/dashboard/index.html
          git add data/task7 Task7/dashboard/data/dashboard.json Task7/dashboard/index.html
          git commit -m "chore(data): auto-update market data $(date +%Y-%m-%d)"
          git push
